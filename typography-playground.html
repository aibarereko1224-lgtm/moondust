<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Moon Dust 中文长文本排版实验页" />
    <title>Typography Playground — Moon Dust</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=Noto+Serif+SC:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/typography-playground.css" />
  </head>
  <body>
    <header class="playground-header">
      <a class="wordmark" href="/" aria-label="返回 Moon Dust 首页">Moon Dust</a>
      <div class="header-copy">
        <p class="eyebrow">Independent type study · 2026</p>
        <h1>Typography Playground</h1>
        <p class="mood">轻、松、透、静、舒服。</p>
      </div>
      <div class="context-strip" aria-label="Moon Dust 内容环境示意">
        <img src="/posters/film-one.svg" alt="" />
        <img src="/posters/book-one.svg" alt="" />
        <div class="context-note">
          <span>SEPTEMBER</span>
          <strong>文字仍会生活在<br />图像与颜色之间</strong>
        </div>
      </div>
    </header>

    <main id="playground" class="playground-main"></main>

    <footer class="playground-footer">
      <span>Moon Dust · Type study only</span>
      <span>不连接数据，不影响正式页面</span>
    </footer>

    <script type="module" src="/typography-playground.js"></script>
  </body>
</html>
